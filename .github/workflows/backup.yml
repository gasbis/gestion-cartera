name: Backup mensual a Cloudflare R2

# Volcado mensual de la base de datos de producción (Postgres en
# Railway) a un bucket de Cloudflare R2 -- ver backup_a_r2.py en la
# raíz del repo para el detalle del volcado/subida. Sin cifrar a
# propósito (no hay datos personales que proteger).
#
# `schedule` dispara el día 1 de cada mes a las 3:00 UTC.
# `workflow_dispatch` añade el botón "Run workflow" en la pestaña
# Actions de GitHub, para poder probarlo a mano sin esperar al cron.
on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar postgresql-client 18 (pg_dump) y boto3
        # Ubuntu trae por defecto el pg_dump de la versión 16, y no
        # puede volcar un servidor más nuevo que él ("server version
        # mismatch") -- el Postgres de Railway va por la 18. Hace
        # falta añadir el repositorio oficial de apt de PostgreSQL
        # para instalar la versión 18 del cliente. Si Railway sube de
        # versión mayor más adelante, el número "18" de aquí abajo
        # (paquete y ruta) habrá que subirlo también.
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          pip install boto3

      - name: Ejecutar backup_a_r2.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python backup_a_r2.py
